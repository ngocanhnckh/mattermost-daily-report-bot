<!DOCTYPE html>
<html>
<head>
    <title>Configuration Management</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .container { margin-top: 2rem; }
        .table-container { margin-bottom: 2rem; }
        .filters { 
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .form-group { margin-bottom: 1rem; }
        .modal-body { max-height: 80vh; overflow-y: auto; }
        .navbar {
            margin-bottom: 2rem;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .nav-link.active {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Scrum Bot Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Daily Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/config">Configuration</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="mb-4">Configuration Management</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">User Mappings</h5>
                        <button class="btn btn-primary btn-sm" onclick="showAddUserModal()">Add User</button>
                    </div>
                    <div class="card-body">
                        <table id="userTable" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Jira Username</th>
                                    <th>Phone</th>
                                    <th>Bio</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Channel Mappings</h5>
                        <button class="btn btn-primary btn-sm" onclick="showAddChannelModal()">Add Channel</button>
                    </div>
                    <div class="card-body">
                        <table id="channelTable" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Channel Name</th>
                                    <th>Jira Project</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Excluded Users</h5>
                        <button class="btn btn-primary btn-sm" onclick="showAddExcludedUserModal()">Add Excluded User</button>
                    </div>
                    <div class="card-body">
                        <table id="excludedUsersTable" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">User Configuration</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userUsername">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="form-group">
                            <label>Jira Username</label>
                            <input type="text" class="form-control" id="jiraUsername" required>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                        <div class="form-group">
                            <label>Bio</label>
                            <textarea class="form-control" id="bio" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Channel Modal -->
    <div class="modal fade" id="channelModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Channel Configuration</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="channelForm">
                        <input type="hidden" id="channelName">
                        <div class="form-group">
                            <label>Channel Name</label>
                            <input type="text" class="form-control" id="channelNameInput" required>
                        </div>
                        <div class="form-group">
                            <label>Jira Project</label>
                            <input type="text" class="form-control" id="jiraProject" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveChannel()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Excluded User Modal -->
    <div class="modal fade" id="excludedUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Excluded User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="excludedUserForm">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" class="form-control" id="excludedUsername" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveExcludedUser()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let userTable, channelTable, excludedUsersTable;
        let userModal, channelModal, excludedUserModal;

        $(document).ready(function() {
            userModal = new bootstrap.Modal(document.getElementById('userModal'));
            channelModal = new bootstrap.Modal(document.getElementById('channelModal'));
            excludedUserModal = new bootstrap.Modal(document.getElementById('excludedUserModal'));

            userTable = $('#userTable').DataTable({
                columns: [
                    { data: 'username' },
                    { data: 'jira_username' },
                    { data: 'phone' },
                    { data: 'bio' },
                    {
                        data: null,
                        render: function(data) {
                            return `
                                <button class="btn btn-sm btn-primary" onclick="editUser('${data.username}')">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteUser('${data.username}')">Delete</button>
                            `;
                        }
                    }
                ]
            });

            channelTable = $('#channelTable').DataTable({
                columns: [
                    { data: 'name' },
                    { data: 'jira_project' },
                    {
                        data: null,
                        render: function(data) {
                            return `
                                <button class="btn btn-sm btn-primary" onclick="editChannel('${data.name}')">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteChannel('${data.name}')">Delete</button>
                            `;
                        }
                    }
                ]
            });

            excludedUsersTable = $('#excludedUsersTable').DataTable({
                columns: [
                    { data: 'username' },
                    {
                        data: null,
                        render: function(data) {
                            return `
                                <button class="btn btn-sm btn-danger" onclick="deleteExcludedUser('${data.username}')">Delete</button>
                            `;
                        }
                    }
                ]
            });

            loadData();
        });

        function loadData() {
            fetch('/api/config')
                .then(response => response.json())
                .then(data => {
                    // Clear and redraw user table
                    const userData = Object.entries(data.users).map(([username, info]) => ({
                        username,
                        ...info
                    }));
                    userTable.clear().rows.add(userData).draw();

                    // Clear and redraw channel table
                    const channelData = Object.entries(data.channels).map(([name, info]) => ({
                        name,
                        ...info
                    }));
                    channelTable.clear().rows.add(channelData).draw();

                    // Update excluded users table
                    excludedUsersTable.clear().rows.add(
                        data.excluded_users.map(username => ({ username }))
                    ).draw();
                })
                .catch(error => {
                    console.error('Error loading data:', error);
                    alert('Error loading data. Please check the console for details.');
                });
        }

        function showAddUserModal() {
            $('#userForm')[0].reset();
            $('#userUsername').val('');
            userModal.show();
        }

        function showAddChannelModal() {
            $('#channelForm')[0].reset();
            $('#channelName').val('');
            channelModal.show();
        }

        function showAddExcludedUserModal() {
            $('#excludedUserForm')[0].reset();
            excludedUserModal.show();
        }

        function editUser(username) {
            fetch(`/api/config/users/${username}`)
                .then(response => response.json())
                .then(data => {
                    $('#userUsername').val(username);
                    $('#username').val(username);
                    $('#jiraUsername').val(data.jira_username);
                    $('#phone').val(data.phone);
                    $('#bio').val(data.bio);
                    userModal.show();
                });
        }

        function editChannel(name) {
            fetch(`/api/config/channels/${name}`)
                .then(response => response.json())
                .then(data => {
                    $('#channelName').val(name);
                    $('#channelNameInput').val(name);
                    $('#jiraProject').val(data.jira_project);
                    channelModal.show();
                });
        }

        function saveUser() {
            const username = $('#username').val();
            const originalUsername = $('#userUsername').val();
            const data = {
                jira_username: $('#jiraUsername').val(),
                phone: $('#phone').val(),
                bio: $('#bio').val()
            };

            console.log('Saving user:', {
                username,
                originalUsername,
                data
            });

            // If this is a new user (no original username) or username changed
            const endpoint = originalUsername && originalUsername !== username ? 
                `/api/config/users/${originalUsername}` : 
                `/api/config/users/${username}`;

            console.log('Using endpoint:', endpoint);

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(result => {
                console.log('Response result:', result);
                if (result.success) {
                    userModal.hide();
                    loadData();
                } else {
                    alert('Error saving user: ' + result.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error saving user. Please check the console for details.');
            });
        }

        function saveChannel() {
            const name = $('#channelNameInput').val();
            const data = {
                jira_project: $('#jiraProject').val()
            };

            fetch(`/api/config/channels/${name}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    channelModal.hide();
                    loadData();
                } else {
                    alert('Error saving channel: ' + result.error);
                }
            });
        }

        function deleteUser(username) {
            if (confirm('Are you sure you want to delete this user?')) {
                fetch(`/api/config/users/${username}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        loadData();
                    } else {
                        alert('Error deleting user: ' + result.error);
                    }
                });
            }
        }

        function deleteChannel(name) {
            if (confirm('Are you sure you want to delete this channel?')) {
                fetch(`/api/config/channels/${name}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        loadData();
                    } else {
                        alert('Error deleting channel: ' + result.error);
                    }
                });
            }
        }

        function saveExcludedUser() {
            const username = $('#excludedUsername').val();
            
            fetch('/api/config/excluded-users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    excludedUserModal.hide();
                    loadData();
                } else {
                    alert('Error saving excluded user: ' + result.error);
                }
            });
        }

        function deleteExcludedUser(username) {
            if (confirm('Are you sure you want to remove this user from the excluded list?')) {
                fetch(`/api/config/excluded-users/${username}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        loadData();
                    } else {
                        alert('Error deleting excluded user: ' + result.error);
                    }
                });
            }
        }
    </script>
</body>
</html>
